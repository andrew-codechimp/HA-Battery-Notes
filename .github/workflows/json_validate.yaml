name: Validate JSONs

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "library/**"
      - ".github/workflows/json*.yaml"
      - "scripts/validate_library"
  pull_request:
    branches:
      - "main"
    paths:
      - "library/**"
      - ".github/workflows/json*.yaml"
      - "scripts/validate_library"

jobs:
  verify-json-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Validate JSON
        run: python3 scripts/validate_library
