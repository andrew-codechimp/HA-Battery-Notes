name: "Release"

on:
  release:
    types:
      - "published"
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"

      - name: "Adjust version number"
        if: github.event_name == 'release'
        shell: "bash"
        run: |
          yq -i -o json '.version="${{ github.event.release.tag_name }}"'             "${{ github.workspace }}/custom_components/battery_notes/manifest.json"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/battery_notes"
          zip battery_notes.zip -r ./

      - name: "Upload the ZIP file to the release"
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: ${{ github.workspace }}/custom_components/battery_notes/battery_notes.zip
