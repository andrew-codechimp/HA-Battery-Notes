name: Deploy docs
on:
  push:
    paths:
      - 'zensical.toml'
      - 'docs/**'
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy_docs:
    name: Deploy docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          key: zensical-${{ runner.os }}-${{ hashFiles('zensical.toml', 'pyproject.toml', 'uv.lock') }}
          path: .cache
          restore-keys: |
            zensical-

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Deploy documentation
        run: |
          uv run --only-group docs zensical gh-deploy --force
